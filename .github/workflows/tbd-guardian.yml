name: guardian-tbd

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  reglas-tbd:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUM: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validar reglas TBD
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          python3 - <<'PY'
          import os, re, sys, json, subprocess, base64
          errors = []
          base = os.environ["BASE"]
          head = os.environ["HEAD"]
          body = os.environ.get("BODY") or ""
          commits = int(os.environ["COMMITS"])
          if base != "main":
              errors.append(f"el PR apunta a '{base}', no a 'main' (TBD: no existen ramas long-lived).")
          if not re.fullmatch(r"(tbd|issue)-\d+(-[a-z0-9]+)*", head):
              errors.append(f"la rama '{head}' no cumple TBD: crea 'issue-<numero>-<slug>' desde main.")
          if not re.search(r"(?i)(closes|fixes|resolves)\s+#\d+", body):
              errors.append("el PR no cierra ningún Issue: escribe 'Closes #<numero>' en la descripción.")
          if commits > 6:
              print(f"::warning:: {commits} commits: no bloquea, pero TBD prefiere batches pequeños (el merge squash une todo igual).")

          # Mensajes de commit estrictos (convención en GUIA_PRACTICANTE.md §Commits)
          # Parseo robusto: la primera línea de cada mensaje viaja en base64 (un mensaje
          # multilínea rompía el parseo anterior por split de \n\n).
          msgs = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GH_REPO']}/pulls/{os.environ['PR_NUM']}/commits",
               "--jq", ".[] | .commit.message | split(\"\\n\")[0] | @base64"], capture_output=True, text=True)
          first_lines = []
          for b in msgs.stdout.splitlines():
              b = b.strip()
              if b:
                  first_lines.append(base64.b64decode(b).decode("utf-8", "replace").strip())
          PAT = re.compile(r"^(feat|fix|docs|test|refactor|ci|chore|perf|style)(\([a-z0-9/_-]+\))?: .{5,}$")
          for line in first_lines:
              if not line:
                  continue
              if line.endswith(".") or "..." in line:
                  errors.append(f"commit '{line}': sin punto final ni elipsis.")
              if len(line) > 72:
                  errors.append(f"commit '{line[:40]}…': supera los 72 caracteres ({len(line)}).")
              if not PAT.match(line):
                  errors.append(f"commit '{line}': debe ser 'tipo(alcance): verbo imperativo' (feat|fix|docs|test|refactor|ci|chore|perf|style) ≤72 chars.")
              if re.search(r"(?i)^(fix|update|cambios|wip|final)$", line):
                  errors.append(f"commit '{line}': mensaje prohibido (vacío/genérico).")
          if errors:
              print("::error::" + " | ".join(errors))
              sys.exit(1)
          print("TBD OK: rama corta, apunta a main, cierra un Issue, commits convencionales")
          PY
