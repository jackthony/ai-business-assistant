name: Digest semanal de seguimiento

on:
  schedule:
    - cron: "0 22 * * 5" # viernes 17:00 Perú (22:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Construir y publicar digest por alumno
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7 (pin por SHA)
        with:
          script: |
            const students = [
              { name: "Allan Zerpa", login: "WhoAllan" },
              { name: "Pilar Aguilar", login: "estefanyP-hub" },
              { name: "Josue Marreros", login: "adbon-dm1" },
            ];
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const sinceIso = since.toISOString();
            const { owner, repo } = context.repo;

            const { data: pulls } = await github.rest.pulls.list({
              owner, repo, state: "all", sort: "updated", direction: "desc", per_page: 100,
            });
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100,
            });

            const week = new Date().toISOString().slice(0, 10);

            const mergedThisWeek = pulls.filter(
              (p) => p.merged_at && new Date(p.merged_at) >= since
            );
            const leadHours = mergedThisWeek.map(
              (p) => (new Date(p.merged_at) - new Date(p.created_at)) / 3600000
            );
            const avgLead = leadHours.length
              ? Math.round(leadHours.reduce((a, b) => a + b, 0) / leadHours.length)
              : null;
            const abandoned = pulls.filter(
              (p) => !p.merged_at && p.state === "closed" && p.closed_at && new Date(p.closed_at) >= since
            );
            let allCommits = [];
            try {
              ({ data: allCommits } = await github.rest.repos.listCommits({
                owner, repo, since: sinceIso, per_page: 100,
              }));
            } catch {}
            const reverts = allCommits.filter((c) => /revert/i.test(c.commit.message)).length;
            let releases = 0;
            try {
              const r = await github.rest.repos.listReleases({ owner, repo, per_page: 20 });
              releases = r.data.filter((x) => new Date(x.published_at) >= since).length;
            } catch {}

            let body = `Digest automático del ${week} (últimos 7 días).\n\n`;
            body += `## DORA (proxies de pre-producción)\n`;
            body += `- Lead time PR→merge: ${avgLead === null ? "—" : `${avgLead} h`} (meta: <3 días S4–S6, <48 h S7+)\n`;
            body += `- PRs mergeados: ${mergedThisWeek.length} · abandonados sin merge: ${abandoned.length} · reverts: ${reverts}\n`;
            body += `- Releases publicadas: ${releases} (deployment frequency relevante desde S14)\n`;
            body += `- MTTR: no aplica hasta producción (S14)\n\n`;
            for (const s of students) {
              let commits;
              try {
                ({ data: commits } = await github.rest.repos.listCommits({
                  owner, repo, author: s.login, since: sinceIso, per_page: 100,
                }));
              } catch {
                commits = [];
              }
              const byDay = {};
              for (const c of commits) {
                const d = c.commit.author.date.slice(0, 10);
                byDay[d] = (byDay[d] || 0) + 1;
              }
              const mine = pulls.filter(
                (p) => p.user.login === s.login && new Date(p.updated_at) >= since
              );
              const openIssues = issues.filter(
                (i) => !i.pull_request && i.assignees.some((a) => a.login === s.login)
              );

              body += `## ${s.name}\n`;
              body += `- **Commits esta semana (${commits.length}):**\n`;
              const days = Object.keys(byDay).sort();
              if (days.length) {
                for (const d of days) body += `  - ${d}: ${byDay[d]} commit(s)\n`;
              } else {
                body += `  - _(sin commits — el registro diario del FPE quedará vacío)_\n`;
              }
              body += `- **PRs movidos esta semana (${mine.length}):**\n`;
              for (const p of mine) {
                const state = p.merged_at ? "✅ mergeado" : p.state === "closed" ? "❌ cerrado" : "🔄 abierto";
                body += `  - #${p.number} ${p.title} — ${state}\n`;
              }
              body += `- **Issues asignados abiertos (${openIssues.length}):**\n`;
              for (const i of openIssues) body += `  - #${i.number} ${i.title}\n`;
              body += `\n`;
            }
            body += `> La automatización muestra dónde mirar; el monitor decide cómo va (ver program/00_PROJECT/operacion.md). El borrador del informe FPE se refresca cada noche con el workflow informe-quincenal.`;
            await github.rest.issues.create({
              owner, repo, title: `Digest semanal — ${week}`, body, labels: ["senati"],
            });
