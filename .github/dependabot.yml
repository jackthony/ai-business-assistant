version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # ruff en 0.x rompe en cada minor: se sube a mano junto con el rev de .pre-commit-config.yaml (#98)
      - dependency-name: "ruff"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      python-menores:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      actions-menores:
        patterns: ["*"]
        update-types: ["minor", "patch"]
