name: discusion-avisa

# Cada discusión nueva recibe un comentario del robot que menciona al resto del equipo
# (así a todos les llega la notificación aunque no vigilen Discussions).
on:
  discussion:
    types: [created]

permissions:
  contents: read
  discussions: write

jobs:
  avisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Avisar al equipo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/discusion_avisa.py
