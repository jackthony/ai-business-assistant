name: release

# Al pushear un tag (v*, hito-*, q*) publica un Release con notas generadas.
# Uso: git tag v0.1.0 && git push origin v0.1.0 — los tags del plan: hito-1 (S6),
# q4 (S8), hito-2 (S9), q5 (S10), hito-3 (S12), q6 (S12), v1.0 (S16).
on:
  push:
    tags: ["v*", "hito-*", "q*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publicar release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" --latest
