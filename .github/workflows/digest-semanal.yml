name: Digest semanal de seguimiento

on:
  schedule:
    - cron: "0 22 * * 5" # viernes 17:00 Perú (22:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Construir y publicar digest por alumno
        uses: actions/github-script@v7
        with:
          script: |
            const students = [
              { name: "Allan Zerpa", login: "WhoAllan" },
              { name: "Pilar Aguilar", login: "estefanyP-hub" },
              { name: "Josue Marreros", login: "adbon-dm1" },
            ];
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const sinceIso = since.toISOString();
            const { owner, repo } = context.repo;

            const { data: pulls } = await github.rest.pulls.list({
              owner, repo, state: "all", sort: "updated", direction: "desc", per_page: 100,
            });
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100,
            });

            const week = new Date().toISOString().slice(0, 10);
            let body = `Digest automático del ${week} (últimos 7 días).\n\n`;
            for (const s of students) {
              let commits;
              try {
                ({ data: commits } = await github.rest.repos.listCommits({
                  owner, repo, author: s.login, since: sinceIso, per_page: 100,
                }));
              } catch {
                commits = [];
              }
              const byDay = {};
              for (const c of commits) {
                const d = c.commit.author.date.slice(0, 10);
                byDay[d] = (byDay[d] || 0) + 1;
              }
              const mine = pulls.filter(
                (p) => p.user.login === s.login && new Date(p.updated_at) >= since
              );
              const openIssues = issues.filter(
                (i) => !i.pull_request && i.assignees.some((a) => a.login === s.login)
              );

              body += `## ${s.name}\n`;
              body += `- **Commits esta semana (${commits.length}):**\n`;
              const days = Object.keys(byDay).sort();
              if (days.length) {
                for (const d of days) body += `  - ${d}: ${byDay[d]} commit(s)\n`;
              } else {
                body += `  - _(sin commits — el registro diario del FPE quedará vacío)_\n`;
              }
              body += `- **PRs movidos esta semana (${mine.length}):**\n`;
              for (const p of mine) {
                const state = p.merged_at ? "✅ mergeado" : p.state === "closed" ? "❌ cerrado" : "🔄 abierto";
                body += `  - #${p.number} ${p.title} — ${state}\n`;
              }
              body += `- **Issues asignados abiertos (${openIssues.length}):**\n`;
              for (const i of openIssues) body += `  - #${i.number} ${i.title}\n`;
              body += `\n`;
            }
            body += `> La automatización muestra dónde mirar; el monitor decide cómo va (ver program/00_PROJECT/operacion.md). El borrador del informe FPE se genera con el workflow informe-quincenal (jueves).`;
            await github.rest.issues.create({
              owner, repo, title: `Digest semanal — ${week}`, body, labels: ["senati"],
            });
