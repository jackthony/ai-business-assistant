[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-business-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0,<1",
    "starlette>=1.9.0,<2",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.2.4,<2",
    "langgraph>=1.2.17,<2",
    "langchain-core>=1.7.0,<2",
    "chromadb>=1.0,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
etl = ["openpyxl>=3.1,<4"]
dev = ["pytest", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.16,<0.17", "mypy", "bandit", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
