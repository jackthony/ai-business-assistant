name: board-sync

# Mantiene el board (GitHub Project) sincronizado con los Issues: Alumno, Semana, Área, Complejidad y
# Status salen de labels, assignees y PRs. Corre en cada evento y cada noche; también a mano:
#   python .github/scripts/board_sync.py --all [--dry-run]
# Vistas, campo de fecha y fechas de hitos: .github/scripts/board_setup.py
# SEGURIDAD: usa BOARD_PAT, así que SOLO corre código de la rama por defecto (pull_request_target, no
# pull_request) y nunca hace checkout del código de un PR.

on:
  issues:
    types: [opened, edited, labeled, unlabeled, assigned, unassigned, closed, reopened]
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, edited]
  schedule:
    - cron: "15 7 * * *" # 02:15 Lima: sincronización completa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pin por SHA — zero trust)
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sincronizar board
        env:
          GH_TOKEN: ${{ secrets.BOARD_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::falta el secreto BOARD_PAT: no se puede escribir en el board"
            exit 0
          fi
          python3 .github/scripts/board_sync.py --all
