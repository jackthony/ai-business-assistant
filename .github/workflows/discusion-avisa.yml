name: discusion-avisa

# Cada discusión nueva recibe un comentario del robot que menciona al resto del equipo
# (así a todos les llega la notificación aunque no vigilen Discussions).
on:
  discussion:
    types: [created]

permissions:
  contents: read
  discussions: write

jobs:
  avisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Avisar al equipo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/discusion_avisa.py
