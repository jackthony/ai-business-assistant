name: guardian-tbd

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  reglas-tbd:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUM: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validar reglas TBD
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
          COMMITS: ${{ github.event.pull_request.commits }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 - <<'PY'
          import os, re, sys, json, subprocess, base64
          errors = []
          base = os.environ["BASE"]
          head = os.environ["HEAD"]
          body = os.environ.get("BODY") or ""
          commits = int(os.environ["COMMITS"])
          if base != "main":
              errors.append(f"el PR apunta a '{base}', no a 'main' (TBD: no existen ramas long-lived).")
          if not re.fullmatch(r"(tbd|issue)-\d+(-[a-z0-9]+)*", head):
              errors.append(f"la rama '{head}' no cumple TBD: crea 'issue-<numero>-<slug>' desde main.")
          if not re.search(r"(?i)(closes|fixes|resolves)\s+#\d+", body):
              errors.append("el PR no cierra ningún Issue: escribe 'Closes #<numero>' en la descripción.")
          if commits > 6:
              print(f"::warning:: {commits} commits: no bloquea, pero TBD prefiere batches pequeños (el merge squash une todo igual).")

          # Mensajes de commit estrictos (convención en GUIA_PRACTICANTE.md §Commits)
          # Parseo robusto: la primera línea de cada mensaje viaja en base64 (un mensaje
          # multilínea rompía el parseo anterior por split de \n\n).
          msgs = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GH_REPO']}/pulls/{os.environ['PR_NUM']}/commits",
               "--jq", ".[] | .commit.message | split(\"\\n\")[0] | @base64"], capture_output=True, text=True)
          first_lines = []
          for b in msgs.stdout.splitlines():
              b = b.strip()
              if b:
                  try:
                      first_lines.append(base64.b64decode(b).decode("utf-8", "replace").strip())
                  except Exception:
                      pass
          if not first_lines and commits > 0:
              errors.append("no pude leer los commits del PR vía API — re-lanza el check (re-run) o avisa al monitor.")
          PAT = re.compile(r"^(feat|fix|docs|test|refactor|ci|chore|perf|style)(\([a-z0-9/_-]+\))?: .{5,}$")
          for line in first_lines:
              if not line:
                  continue
              if line.startswith("Merge "):
                  # sincronizar con main con merge es legítimo; el squash final aplana todo
                  continue
              if line.endswith(".") or "..." in line:
                  errors.append(f"commit '{line}': sin punto final ni elipsis.")
              if len(line) > 72:
                  errors.append(f"commit '{line[:40]}…': supera los 72 caracteres ({len(line)}).")
              if not PAT.match(line):
                  errors.append(f"commit '{line}': debe ser 'tipo(alcance): verbo imperativo' (feat|fix|docs|test|refactor|ci|chore|perf|style) ≤72 chars.")
              if re.search(r"(?i)^(fix|update|cambios|wip|final)$", line):
                  errors.append(f"commit '{line}': mensaje prohibido (vacío/genérico).")

          # Puerta de comprensión: la plantilla del PR es obligatoria (se responde, no se borra)
          if "comprensi" not in body.lower():
              errors.append("el PR no incluye la sección 'Preguntas de comprensión' — completa la plantilla y respóndelas con tus palabras.")
          elif len(body.strip()) < 250:
              errors.append("el cuerpo del PR es muy corto: completa la plantilla (qué/por qué, cómo se probó, checklist, preguntas).")

          # Política de equipo: Issues de otro compañero (aviso; el monitor decide)
          mref = re.search(r"(?i)(closes|fixes|resolves)\s+#(\d+)", body)
          if mref:
              info = subprocess.run(["gh", "api", f"repos/{os.environ['GH_REPO']}/issues/{mref.group(2)}",
                                     "--jq", '{a: [.assignees[].login], l: [.labels[].name]}'],
                                    capture_output=True, text=True)
              try:
                  meta = json.loads(info.stdout)
                  author = os.environ.get("AUTHOR", "")
                  if meta.get("a") and author and author not in meta["a"] and "disponible" not in meta.get("l", []):
                      print(f"::warning:: El Issue #{mref.group(2)} pertenece a @{' @'.join(meta['a'])} — política de equipo: trabaja solo tus Issues; si fue con permiso del monitor o proactividad justificada, explícalo en el PR.")
              except Exception:
                  pass
          if errors:
              print("::error::" + " | ".join(errors))
              sys.exit(1)
          print("TBD OK: rama corta, apunta a main, cierra un Issue, commits convencionales")
          PY
