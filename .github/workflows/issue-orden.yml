name: issue-orden

# Cada Issue nuevo (o con etiquetas nuevas) sale completo: hito, tracker padre y bloqueos.
# Manual: Run workflow rellena todos los Issues abiertos.
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ordenar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ordenar Issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
        run: python3 .github/scripts/issue_orden.py "${NUM:---all}"
