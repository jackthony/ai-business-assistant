name: CI estricto

# Corre en TODO PR (sin filtro de paths): el ruleset exige este check para mergear,
# así que debe reportar siempre. Las puertas son tolerantes: si aún no existe src/ o
# tests/ (docs-only), pasan sin hacer nada en vez de fallar.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-24.04 # fijado: ubuntu-latest migra de versión sin aviso
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pin por SHA — zero trust)
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (pin por SHA)
        with:
          python-version: "3.11"
          # caché solo si ya existe un archivo de dependencias; si no, setup-python falla
          cache: ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') != '' && 'pip' || '' }}
      - name: Instalar toolchain
        run: |
          pip install -q ruff mypy pytest bandit
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
      - name: 1. Lint — ruff (cero warnings)
        run: |
          if [ -d src ] || [ -d tests ]; then
            ARGS=""
            [ -d src ] && ARGS="$ARGS src"
            [ -d tests ] && ARGS="$ARGS tests"
            ruff check $ARGS
          else
            echo "sin código Python todavía (docs-only) — skip"
          fi
      - name: 2. Tipado — mypy (cero errores)
        run: |
          if [ -d src ]; then mypy src --ignore-missing-imports; else echo "sin src — skip"; fi
      - name: 3. Tests — pytest (mocks, sin tokens)
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' -print -quit | grep -q .; then
            pytest tests -q --strict-markers
          else
            echo "sin tests todavía — skip"
          fi
      - name: 4. Seguridad — bandit (alta y media)
        run: |
          if [ -d src ]; then bandit -r src -x tests -ll; else echo "sin src — skip"; fi

  dependency-review:
    # la acción solo entiende PRs; en push a main fallaría sin este if
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pin por SHA — zero trust)
        with:
          persist-credentials: false
      - name: Revisar dependencias (cadena de suministro)
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4 (pin por SHA)
        with:
          fail-on-severity: high
